project:
  type: website
  resources: images
  output-dir: docs
  # What's changed page (BetaNYC standard): rebuild whats-changed.qmd from WHATS-CHANGED.md
  # before every render. scripts/whats_changed.py is a copy from the BetaNYC workspace;
  # never edit it here.
  pre-render: python3 scripts/whats_changed.py render WHATS-CHANGED.md --format quarto --out whats-changed.qmd --repo-url https://github.com/BetaNYC/mbpo-dog-poop

website:
  navbar: false
  page-footer:
    center: '<a href="whats-changed.html" style="display: inline-block; padding: 12px 0;">What''s changed</a>'

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: false
    include-before-body: radar-header.html
    fig-format: svg
    fig-dpi: 300
execute:
  message: false
  warning: false
  freeze: false